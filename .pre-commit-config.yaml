default_install_hook_types: [pre-commit, commit-msg]
repos:
  - repo: https://github.com/kilotronic/lint
    rev: 57c42f430af9a89607e32d1947714e2e594db6f3 # frozen: v1.2.0
    hooks:
      - id: ruff-format
      - id: prettier
      - id: shfmt
      - id: taplo-format
      - id: ruff-check
      - id: shellcheck
      - id: actionlint
      - id: markdownlint
      - id: yamllint
      - id: csv-lint
      - id: check-json
      - id: check-yaml
      - id: check-toml
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: mixed-line-ending
      - id: check-merge-conflict
      - id: pinned
      - id: workflow-safety
      - id: non-root
  - repo: https://github.com/kilotronic/git-identity
    rev: b0d54e809d81cabf61d357cbe519a9b9263b17cb # frozen: v2.4.0
    hooks:
      - id: git-identity
      - id: session-trailer
