default_install_hook_types: [pre-commit, commit-msg]
repos:
  - repo: https://github.com/kilotronic/lint
    rev: b5343bfa69d890919c8774733da372d13d23d6d3 # frozen: v1.3.1
    hooks:
      - id: ruff-format
      - id: prettier
      - id: shfmt
      - id: taplo-format
      - id: ruff-check
      - id: shellcheck
      - id: actionlint
      - id: markdownlint
      - id: yamllint
      - id: csv-lint
      - id: check-json
      - id: check-yaml
      - id: check-toml
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: mixed-line-ending
      - id: check-merge-conflict
      - id: pinned
      - id: workflow-safety
      - id: non-root
  - repo: https://github.com/kilotronic/git-identity
    rev: b0d54e809d81cabf61d357cbe519a9b9263b17cb # frozen: v2.4.0
    hooks:
      - id: git-identity
        fail_fast: true
      - id: session-trailer
